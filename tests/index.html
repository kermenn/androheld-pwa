<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AndroHeld Web - Test Runner & Security Suite</title>
  <style>
    :root {
      --bg: #0F0F12;
      --card-bg: rgba(26, 26, 36, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #F1F5F9;
      --text-muted: #94A3B8;
      --accent-green: #10B981;
      --accent-red: #EF4444;
      --accent-blue: #3B82F6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 32px 16px; min-height: 100vh; }
    .container { max-width: 820px; margin: 0 auto; }
    
    .header {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      backdrop-filter: blur(12px);
    }
    .header h1 { font-size: 1.5rem; margin-bottom: 8px; color: #fff; }
    .header p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.4; }
    
    .stats-bar {
      display: flex;
      gap: 16px;
      margin-top: 16px;
    }
    .stat-badge {
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .stat-passed { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.3); }
    .stat-failed { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); }
    .stat-total { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); border: 1px solid rgba(59, 130, 246, 0.3); }

    .test-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }
    .test-info { display: flex; flex-direction: column; gap: 4px; }
    .test-title { font-size: 0.95rem; font-weight: 500; }
    .test-desc { font-size: 0.8rem; color: var(--text-muted); }
    
    .badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .badge-pass { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); }
    .badge-fail { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }
    .badge-running { background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); }

    .btn-run {
      background: #2563EB;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      transition: opacity 0.2s;
    }
    .btn-run:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>⚡ AndroHeld Web - In-Browser Test Suite</h1>
      <p>Automated verification for Web PWA security, PIN SHA-256 salted hashing, schedule projection logic, and Supabase synchronization contracts.</p>
      <div class="stats-bar">
        <div class="stat-badge stat-passed" id="stat-pass">Passed: 0</div>
        <div class="stat-badge stat-failed" id="stat-fail">Failed: 0</div>
        <div class="stat-badge stat-total" id="stat-total">Total: 0</div>
      </div>
      <button class="btn-run" id="btn-rerun">Jalankan Ulang Semua Tes</button>
    </div>

    <div id="test-results-container"></div>
  </div>

  <script type="module">
    const PIN_SALT = "androheld_roster_secure_salt_2026";

    async function hashAdminPin(plainPin) {
      const clean = (plainPin || "").trim();
      const msgBuffer = new TextEncoder().encode(PIN_SALT + clean);
      const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
      return `sha256:${hashHex}`;
    }

    async function verifyAdminPin(enteredPin, storedPin) {
      const clean = (enteredPin || "").trim();
      const stored = (storedPin || "").trim();
      if (!clean || !stored) return false;
      if (stored.startsWith("sha256:")) {
        const hashed = await hashAdminPin(clean);
        return hashed === stored;
      }
      return clean === stored;
    }

    const testSuites = [
      {
        name: "Security: SHA-256 Salted Hashing Vector ('3110')",
        desc: "Verifies Web Crypto API digest matches Kotlin/Android and Python hash vectors",
        fn: async () => {
          const hash = await hashAdminPin("3110");
          if (hash !== "sha256:a491cc13b8858f6fe5ab3b89a11a0a0c3e3c64b343e97452a9cd160c1caca701") {
            throw new Error(`Hash mismatch: got ${hash}`);
          }
        }
      },
      {
        name: "Security: Default PIN '1234' Hash Vector",
        desc: "Verifies fallback default PIN hashes correctly across platforms",
        fn: async () => {
          const hash = await hashAdminPin("1234");
          if (hash !== "sha256:2102f0d9ec5696c167b68056c4cb4c04f991f896f9f79dbb7e76ba46c7e6b625") {
            throw new Error(`Hash mismatch: got ${hash}`);
          }
        }
      },
      {
        name: "Security: PIN Verification Success & Rejection",
        desc: "Ensures correct PIN verifies and wrong PIN is strictly rejected",
        fn: async () => {
          const stored = "sha256:a491cc13b8858f6fe5ab3b89a11a0a0c3e3c64b343e97452a9cd160c1caca701";
          const ok = await verifyAdminPin("3110", stored);
          const fail = await verifyAdminPin("9999", stored);
          const empty = await verifyAdminPin("", stored);
          if (!ok || fail || empty) {
            throw new Error(`Verification logic error: ok=${ok}, fail=${fail}, empty=${empty}`);
          }
        }
      },
      {
        name: "Security: Legacy Plain Text PIN Migration Support",
        desc: "Ensures old plain text PIN from earlier app versions can be verified and gracefully upgraded",
        fn: async () => {
          const legacy = "3110";
          const ok = await verifyAdminPin("3110", legacy);
          const fail = await verifyAdminPin("1234", legacy);
          if (!ok || fail) throw new Error("Legacy plain text migration check failed");
        }
      },
      {
        name: "Architecture: Supabase CONFIG_PIN Isolation",
        desc: "Confirms employee_id = 0 config row is excluded from staff roster calculations",
        fn: async () => {
          const rows = [
            { employee_id: 0, date: "CONFIG_PIN", shift: "sha256:test" },
            { employee_id: 2, date: "2026-10-01", shift: "D" }
          ];
          const staffRows = rows.filter(r => r.employee_id > 0);
          if (staffRows.length !== 1 || staffRows[0].employee_id !== 2) {
            throw new Error("Staff isolation logic failure");
          }
        }
      },
      {
        name: "Offline Storage: LocalStorage Integrity",
        desc: "Validates browser localStorage read/write capabilities",
        fn: async () => {
          const testKey = "__androheld_test_key__";
          localStorage.setItem(testKey, "active");
          const val = localStorage.getItem(testKey);
          localStorage.removeItem(testKey);
          if (val !== "active") throw new Error("LocalStorage read/write failed");
        }
      }
    ];

    async function runAllTests() {
      const container = document.getElementById('test-results-container');
      container.innerHTML = '';
      let passed = 0;
      let failed = 0;

      for (let i = 0; i < testSuites.length; i++) {
        const t = testSuites[i];
        const card = document.createElement('div');
        card.className = 'test-card';
        card.innerHTML = `
          <div class="test-info">
            <span class="test-title">${t.name}</span>
            <span class="test-desc">${t.desc}</span>
          </div>
          <span class="badge badge-running">RUNNING</span>
        `;
        container.appendChild(card);

        try {
          await t.fn();
          card.querySelector('.badge').className = 'badge badge-pass';
          card.querySelector('.badge').textContent = 'PASS';
          passed++;
        } catch (err) {
          card.querySelector('.badge').className = 'badge badge-fail';
          card.querySelector('.badge').textContent = 'FAIL';
          const errDiv = document.createElement('div');
          errDiv.style.color = 'var(--accent-red)';
          errDiv.style.fontSize = '0.75rem';
          errDiv.style.marginTop = '4px';
          errDiv.textContent = err.message;
          card.querySelector('.test-info').appendChild(errDiv);
          failed++;
        }
      }

      document.getElementById('stat-pass').textContent = `Passed: ${passed}`;
      document.getElementById('stat-fail').textContent = `Failed: ${failed}`;
      document.getElementById('stat-total').textContent = `Total: ${testSuites.length}`;
    }

    document.getElementById('btn-rerun').addEventListener('click', runAllTests);
    runAllTests();
  </script>
</body>
</html>
